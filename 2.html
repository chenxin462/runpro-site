<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>运动截图拼图工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ========== 左栏：素材区 ========== -->
  <aside id="material-panel">
    <div class="panel-header">
      <h2>📦 素材库</h2>
    </div>
    <div id="material-list">
      <!-- 素材由 JS 动态生成 -->
    </div>
  </aside>

  <!-- ========== 中栏：画布区 ========== -->
  <main id="canvas-area">
    <div id="canvas-wrapper">
      <canvas id="main-canvas"></canvas>
      <!-- 对齐提示 -->
      <div id="align-hint" class="align-hint">↔ 已对齐</div>
    </div>

    <!-- 画布右下角缩放控件 -->
    <div id="zoom-controls">
      <button id="zoom-in" title="放大">＋</button>
      <button id="zoom-out" title="缩小">－</button>
      <button id="zoom-fit" title="适应窗口">⤢</button>
    </div>

    <!-- 顶部居中状态提示 -->
    <div id="top-status"></div>
  </main>

  <!-- ========== 右栏：操作区 ========== -->
  <aside id="control-panel">

    <!-- 操作按钮区 -->
    <section class="ctrl-section">
      <h3>🛠 操作</h3>
      <div class="btn-group">
        <button id="btn-upload" class="btn btn-primary">📁 上传底图</button>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
        <button id="btn-erase" class="btn">🧽 抹平工具</button>
        <button id="btn-undo" class="btn">↶ 撤销</button>
        <button id="btn-reset" class="btn btn-danger">🗑 重置</button>
        <button id="btn-export" class="btn btn-success">💾 导出 JPG</button>
      </div>
    </section>

    <!-- 默认缩放比例 -->
    <section class="ctrl-section">
      <h3>⚙️ 默认缩放比例</h3>
      <div class="scale-row">
        <button id="scale-dec" class="btn btn-sm">−</button>
        <input type="number" id="scale-input" value="100" min="20" max="300" step="10">
        <span class="unit">%</span>
        <button id="scale-inc" class="btn btn-sm">+</button>
      </div>
      <div class="notice">
        <strong>⚠️ 使用说明：</strong><br>
        ① 先拖一个素材到画布上，看看大小是否合适<br>
        ② 如果太大或太小，在这里调整比例（数字越大素材越大）<br>
        ③ 调好后，后面新加的素材都会自动按这个大小显示<br>
        ④ 已经放上去的素材不会变，每个素材也可以单独缩放
      </div>
    </section>

    <!-- 自定义信息开关 -->
    <section class="ctrl-section">
      <h3>👤 自定义信息</h3>
      <div class="check-group">
        <label><input type="checkbox" id="chk-avatar"> 显示头像</label>
        <label><input type="checkbox" id="chk-username"> 显示用户名</label>
        <label><input type="checkbox" id="chk-datetime" checked disabled> 显示日期时间</label>
      </div>
    </section>

    <!-- 自定义信息编辑区 -->
    <section class="ctrl-section" id="custom-edit-section">
      <!-- 头像编辑 -->
      <div id="avatar-edit" class="sub-edit hidden">
        <label class="sub-label">头像</label>
        <div class="avatar-edit-row">
          <div id="avatar-preview" class="avatar-preview"></div>
          <div class="avatar-btns">
            <button id="btn-upload-avatar" class="btn btn-sm">上传头像</button>
            <input type="file" id="avatar-input" accept="image/jpeg,image/png" hidden>
            <button id="btn-del-avatar" class="btn btn-sm btn-danger">删除</button>
          </div>
        </div>
      </div>

      <!-- 用户名编辑 -->
      <div id="username-edit" class="sub-edit hidden">
        <label class="sub-label">用户名</label>
        <input type="text" id="username-input" value="用户名61515321" maxlength="30">
      </div>

      <!-- 日期编辑 -->
      <div id="datetime-edit" class="sub-edit">
        <label class="sub-label">日期</label>
        <div class="date-row">
          <input type="number" id="dt-year" value="2025" min="2000" max="2099" class="dt-input">
          <span>/</span>
          <input type="number" id="dt-month" value="6" min="1" max="12" class="dt-input">
          <span>/</span>
          <input type="number" id="dt-day" value="4" min="1" max="31" class="dt-input">
        </div>
        <label class="sub-label">时间</label>
        <div class="time-row">
          <input type="time" id="dt-start" value="16:08" class="dt-input">
          <span>—</span>
          <input type="time" id="dt-end" value="16:43" class="dt-input">
        </div>
      </div>
    </section>

    <!-- 快捷键提示 -->
    <section class="ctrl-section">
      <h3>⌨ 快捷键</h3>
      <div class="shortcut-list">
        <div><kbd>←↑→↓</kbd> 移动 1px</div>
        <div><kbd>Shift</kbd>+<kbd>←↑→↓</kbd> 移动 10px</div>
        <div><kbd>Del</kbd>/<kbd>⌫</kbd> 删除选中</div>
        <div><kbd>+</kbd>/<kbd>-</kbd> 缩放 10%</div>
        <div><kbd>Esc</kbd> 取消选中/框选</div>
      </div>
    </section>

    <!-- 状态栏 -->
    <section class="ctrl-section status-bar">
      <div id="status-text">就绪</div>
      <div id="status-info"></div>
    </section>

  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
