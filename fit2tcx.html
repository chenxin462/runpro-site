<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- force 360/qq/sogou browsers to use webkit/blink kernel -->
<meta name="renderer" content="webkit">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIT → TCX 转换器（本地单文件版）</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --main:#2b6cb0; --ok:#2f855a; --err:#c53030; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1a202c; padding:24px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:#5a6573; font-size:13px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:22px; text-align:center; cursor:pointer; transition:.15s; }
  .drop:hover { border-color:var(--main); background:#f0f6ff; }
  input[type=file] { display:none; }
  .btn { margin-top:14px; background:var(--main); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
  .btn:hover { opacity:.92; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  #log { margin-top:16px; white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; max-height:280px; overflow:auto; color:#2d3748; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .note { margin-top:14px; font-size:12px; color:#718096; }
  .warn { background:#fff5f5; border:1px solid #fc8181; color:#c53030; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:13px; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FIT → TCX 转换器</h1>
  <p class="sub">纯本地转换，文件不会上传到任何服务器。支持多选批量转换。</p>
  <div class="card">
    <div class="warn" id="warn">浏览器内核不支持或脚本未加载，请切换到<strong>极速模式</strong>，或用 Chrome/Edge 打开本文件。</div>
    <label class="drop" id="drop">
      <div>点击选择 .fit 文件（可多选）</div>
      <input type="file" id="file" accept=".fit" multiple>
    </label>
    <button class="btn" id="btn">转换并下载</button>
    <div id="log"></div>
    <div class="note">若转换失败，请检查浏览器是否处于极速/兼容模式。单文件版无需额外 js 文件。</div>
  </div>
</div>

<script>
// FIT -> TCX parser. Browser + Node compatible.
// Depends on global FIT_PROFILE (generated from python fitparse).
const FIT_EPOCH_MS = Date.UTC(1989, 11, 31, 0, 0, 0);

// FIT base types: index -> {size, signed, str}
const BASE_TYPES = {
  0: { size: 1, signed: false },        // enum
  1: { size: 1, signed: true },         // sint8
  2: { size: 1, signed: false },        // uint8
  3: { size: 2, signed: true },         // sint16
  4: { size: 2, signed: false },        // uint16
  5: { size: 4, signed: true },         // sint32
  6: { size: 4, signed: false },        // uint32
  7: { size: 1, signed: false, str: true }, // string
  8: { size: 4, signed: false },        // float32
  9: { size: 8, signed: false },        // float64
  10: { size: 1, signed: false },       // uint8z
  11: { size: 2, signed: false },       // uint16z
  12: { size: 4, signed: false },       // uint32z
  13: { size: 1, signed: false }         // byte
};

// global message number -> local name we care about
const MSG_NAMES = { 18: 'session', 19: 'lap', 20: 'record', 34: 'activity' };

// FIT sport enum (subset) -> TCX-compatible name
const SPORT_ENUM = {
  0: 'Other', 1: 'Running', 2: 'Biking', 3: 'Transition', 4: 'FitnessEquipment',
  5: 'Swimming', 6: 'Basketball', 7: 'Soccer', 8: 'Tennis', 9: 'Football',
  10: 'Training', 11: 'Walking', 12: 'CrossCountrySkiing', 13: 'AlpineSkiing',
  14: 'Snowboarding', 15: 'Rowing', 16: 'Mountaineering', 17: 'Hiking',
  18: 'Multisport', 19: 'Paddling', 20: 'Flying', 21: 'Cycling', 22: 'Running',
  23: 'Walking', 24: 'Diving', 25: 'Elliptical', 26: 'RollerSkiing',
  27: 'InlineSkating', 28: 'DownhillSkiing'
};

// Port of fitparse._apply_compressed_accumulation (num_bits=5 for timestamps)
function applyCompressedAccumulation(rawValue, accumulation, numBits) {
  const maxValue = (1 << numBits);
  const maxMask = maxValue - 1;
  // Keep the high bits of the accumulator; add the raw (low) value.
  // If raw wrapped below the previous low bits, roll over by maxValue.
  let baseValue = rawValue + (accumulation - (accumulation & maxMask));
  if (rawValue < (accumulation & maxMask)) baseValue += maxValue;
  return baseValue;
}

function parseFit(arrayBuffer) {
  const dv = new DataView(arrayBuffer);
  const headerSize = dv.getUint8(0);
  let dataSize = 0;
  if (headerSize >= 12) dataSize = dv.getUint32(4, true);
  const dataEnd = dataSize > 0 ? headerSize + dataSize : dv.byteLength;

  const definitions = {};
  const messages = { record: [], lap: [], session: [], activity: [] };
  let off = headerSize;
  let compressedTs = 0; // running compressed-timestamp accumulator (seconds since FIT epoch)

  while (off < dataEnd) {
    const header = dv.getUint8(off); off++;
    let localNum, isDefinition, isDeveloperData, timeOffset;

    if (header & 0x80) {
      // Compressed timestamp header (bit7 set): a data message with implicit timestamp
      localNum = (header >> 5) & 0x3;     // bits 5-6
      timeOffset = header & 0x1F;         // bits 0-4
      isDefinition = false;
      isDeveloperData = false;
    } else {
      isDefinition = (header & 0x40) !== 0;    // bit 6
      isDeveloperData = (header & 0x20) !== 0; // bit 5
      localNum = header & 0xF;                 // bits 0-3
      timeOffset = null;
    }

    if (isDefinition) {
      off++; // reserved byte
      const arch = dv.getUint8(off); off++;
      const le = (arch === 0); // 0 = little endian, 1 = big endian
      const global = le ? dv.getUint16(off, true) : dv.getUint16(off, false); off += 2;
      const numFields = dv.getUint8(off); off++;
      const fields = [];
      for (let i = 0; i < numFields; i++) {
        const fnum = dv.getUint8(off); off++;
        const fsize = dv.getUint8(off); off++;
        const ftype = dv.getUint8(off); off++;
        const bt = BASE_TYPES[ftype & 0x1F] || { size: fsize, signed: false };
        fields.push({ num: fnum, size: fsize, signed: !!bt.signed, str: !!bt.str, dev: false });
      }
      // Developer fields: 1 count byte + 3 bytes each, only present when isDeveloperData
      if (isDeveloperData) {
        const numDev = dv.getUint8(off); off++;
        for (let i = 0; i < numDev; i++) {
          const fnum = dv.getUint8(off); off++;
          const fsize = dv.getUint8(off); off++;
          const ftype = dv.getUint8(off); off++; // 3rd byte is dev_data_index, ignored for skipping
          const bt = BASE_TYPES[ftype & 0x1F] || { size: fsize, signed: false };
          fields.push({ num: fnum, size: fsize, signed: !!bt.signed, str: !!bt.str, dev: true });
        }
      }
      definitions[localNum] = { global, fields, le };
    } else {
      const def = definitions[localNum];
      if (!def) break; // unknown data message, cannot decode further
      const vals = {};
      for (const f of def.fields) {
        let rawVal;
        if (f.str) {
          let s = '';
          for (let i = 0; i < f.size; i++) {
            const c = dv.getUint8(off + i);
            if (c === 0) break;
            s += String.fromCharCode(c);
          }
          off += f.size; rawVal = s;
        } else {
          let v = null;
          if (f.size === 1) v = f.signed ? dv.getInt8(off) : dv.getUint8(off);
          else if (f.size === 2) v = f.signed ? dv.getInt16(off, def.le) : dv.getUint16(off, def.le);
          else if (f.size === 4) v = f.signed ? dv.getInt32(off, def.le) : dv.getUint32(off, def.le);
          else if (f.size === 8) v = Number(f.signed ? dv.getBigInt64(off, def.le) : dv.getBigUint64(off, def.le));
          off += f.size; rawVal = v;
        }
        if (f.dev) continue; // developer data fields: skip (offset already advanced)
        // A normal (non-compressed) timestamp field updates the accumulator
        if (f.num === 253 && rawVal !== null) compressedTs = rawVal;
        const prof = FIT_PROFILE[def.global];
        if (prof && prof.fields[f.num]) {
          const fd = prof.fields[f.num];
          let value = rawVal;
          if (rawVal !== null && !f.str) {
            if (fd.semi) value = rawVal * (180 / Math.pow(2, 31));
            else value = rawVal / fd.scale + fd.offset;
            if (fd.name === 'timestamp') value = new Date(FIT_EPOCH_MS + rawVal * 1000);
          }
          vals[fd.name] = value;
        } else {
          vals['unknown_' + f.num] = rawVal;
        }
      }
      // Compressed timestamp header: inject the accumulated timestamp
      if (timeOffset !== null) {
        compressedTs = applyCompressedAccumulation(timeOffset, compressedTs, 5);
        vals['timestamp'] = new Date(FIT_EPOCH_MS + compressedTs * 1000);
      }
      const name = MSG_NAMES[def.global];
      if (name) messages[name].push(vals);
    }
  }
  return messages;
}

function esc(s) {
  return ('' + s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function q(x) {
  if (typeof x === 'number') { let s = x.toFixed(6); return s.replace(/0+$/, '').replace(/\.$/, ''); }
  return x == null ? '' : '' + x;
}
function iso(d) {
  if (d instanceof Date) return d.toISOString().replace(/\.\d{3}Z$/, 'Z');
  if (typeof d === 'number') return new Date(FIT_EPOCH_MS + d * 1000).toISOString().replace(/\.\d{3}Z$/, 'Z');
  return '' + d;
}

function trackpoint(r) {
  if (!r || !r.timestamp) return '';
  const L = ['          <Trackpoint>'];
  L.push('            <Time>' + iso(r.timestamp) + '</Time>');
  if (r.position_lat != null && r.position_long != null) {
    L.push('            <Position>');
    L.push('              <LatitudeDegrees>' + q(r.position_lat) + '</LatitudeDegrees>');
    L.push('              <LongitudeDegrees>' + q(r.position_long) + '</LongitudeDegrees>');
    L.push('            </Position>');
  }
  if (r.altitude != null) L.push('            <AltitudeMeters>' + q(r.altitude) + '</AltitudeMeters>');
  if (r.heart_rate != null) L.push('            <HeartRateBpm><Value>' + Math.round(r.heart_rate) + '</Value></HeartRateBpm>');
  if (r.cadence != null) L.push('            <Cadence>' + Math.round(r.cadence) + '</Cadence>');
  let ext = '';
  if (r.speed != null) ext += '              <ext:Speed>' + q(r.speed) + '</ext:Speed>\n';
  if (r.power != null) ext += '              <ext:Watts>' + Math.round(r.power) + '</ext:Watts>\n';
  if (ext) L.push('            <Extensions><ext:TPX>\n' + ext + '            </ext:TPX></Extensions>');
  L.push('          </Trackpoint>');
  return L.join('\n');
}

function buildTCX(messages) {
  const recs = messages.record, laps = messages.lap, sess = messages.session[0];
  let sport = 'Other';
  if (sess && sess.sport != null) {
    if (typeof sess.sport === 'string') { let s = sess.sport; sport = s.charAt(0).toUpperCase() + s.slice(1); }
    else sport = SPORT_ENUM[sess.sport] || 'Other';
  }
  const L = [];
  L.push("<?xml version='1.0' encoding='utf-8'?>");
  L.push('<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ext="http://www.garmin.com/xmlschemas/ActivityExtension/v2">');
  L.push('  <Activities>');
  L.push('    <Activity Sport="' + esc(sport) + '">');

  let id = null;
  if (recs.length) id = recs[0].timestamp;
  else if (laps.length) id = laps[0].start_time;
  else if (sess && sess.start_time) id = sess.start_time;
  if (id) L.push('      <Id>' + iso(id) + '</Id>');

  const emitLap = (lapv) => {
    L.push('      <Lap StartTime="' + iso(lapv.start_time) + '">');
    if (lapv.total_elapsed_time != null) L.push('        <TotalTimeSeconds>' + q(lapv.total_elapsed_time) + '</TotalTimeSeconds>');
    if (lapv.total_distance != null) L.push('        <DistanceMeters>' + q(lapv.total_distance) + '</DistanceMeters>');
    if (lapv.total_calories != null) L.push('        <Calories>' + Math.round(lapv.total_calories) + '</Calories>');
    if (lapv.avg_heart_rate != null) L.push('        <AverageHeartRateBpm><Value>' + Math.round(lapv.avg_heart_rate) + '</Value></AverageHeartRateBpm>');
    if (lapv.max_heart_rate != null) L.push('        <MaximumHeartRateBpm><Value>' + Math.round(lapv.max_heart_rate) + '</Value></MaximumHeartRateBpm>');
    const start = lapv.start_time, end = lapv.timestamp;
    const lapRecs = [];
    for (const r of recs) {
      if (!r.timestamp) continue;
      if (start && r.timestamp < start) continue;
      if (end && r.timestamp > end) continue;
      lapRecs.push(r);
    }
    L.push('        <Track>');
    for (const r of lapRecs) L.push(trackpoint(r));
    L.push('        </Track>');
    L.push('      </Lap>');
  };

  if (laps.length) {
    for (const lv of laps) emitLap(lv);
  } else {
    const st = sess ? sess.start_time : (recs[0] ? recs[0].timestamp : new Date());
    L.push('      <Lap StartTime="' + iso(st) + '">');
    if (sess) {
      if (sess.total_elapsed_time != null) L.push('        <TotalTimeSeconds>' + q(sess.total_elapsed_time) + '</TotalTimeSeconds>');
      if (sess.total_distance != null) L.push('        <DistanceMeters>' + q(sess.total_distance) + '</DistanceMeters>');
      if (sess.total_calories != null) L.push('        <Calories>' + Math.round(sess.total_calories) + '</Calories>');
      if (sess.avg_heart_rate != null) L.push('        <AverageHeartRateBpm><Value>' + Math.round(sess.avg_heart_rate) + '</Value></AverageHeartRateBpm>');
      if (sess.max_heart_rate != null) L.push('        <MaximumHeartRateBpm><Value>' + Math.round(sess.max_heart_rate) + '</Value></MaximumHeartRateBpm>');
    }
    L.push('        <Track>');
    for (const r of recs) L.push(trackpoint(r));
    L.push('        </Track>');
    L.push('      </Lap>');
  }

  L.push('      <Creator><Name>fit2tcx-web</Name></Creator>');
  L.push('    </Activity>');
  L.push('  </Activities>');
  L.push('</TrainingCenterDatabase>');
  return L.join('\n');
}

if (typeof module !== 'undefined' && module.exports) module.exports = { parseFit, buildTCX };

  el.appendChild(span);
}

  document.getElementById('warn').style.display = 'block';
}
document.getElementById('btn').addEventListener('click', async () => {
  if (typeof parseFit === 'undefined' || typeof buildTCX === 'undefined') {
    logLine('脚本未加载，请切换浏览器极速模式后再试', 'err');
    return;
  }

  const files = input.files;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = out;
      a.click();
      URL.revokeObjectURL(a.href);
      const lapInfo = msgs.lap.length ? (' | ' + msgs.lap.length + ' 圈') : '';
      logLine('OK  ' + file.name + ' → ' + out + '  (' + msgs.record.length + ' 轨迹点' + lapInfo + ')', 'ok');
    } catch (e) {
      logLine('FAIL  ' + file.name + ': ' + e.message, 'err');
    }
  }
  logLine('—— 完成 ——');
});
</script>
</body>
</html>
